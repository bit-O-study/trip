<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여행 준비물</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 1800px; box-sizing: border-box; background: #F6F2EA; color: #1C1B18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; line-height: 1.55; padding: 0 20px">

<div style="display: flex; align-items: center; justify-content: space-between; padding-top: 12px">
<a href="Schedule.dc.html" aria-label="일정으로" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</a>
</div>
<h1 style="margin: 4px 0 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 28px; line-height: 1.3; letter-spacing: -0.02em">대만 4박 5일</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #5E594F">11.19 목 – 11.23 월 · 가오슝 → 타이베이</p>

<nav aria-label="여행 메뉴" style="display: flex; gap: 8px; margin: 18px -20px 0; padding: 0 20px; overflow-x: auto">
<a href="Schedule.dc.html" style="flex: none; display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; background: #ECE5D6; font-size: 15px">일정</a>
<a href="Packing.dc.html" aria-current="page" style="flex: none; display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; background: #1C1B18; color: #F6F2EA; font-size: 15px; font-weight: 600">준비물</a>
<a href="Schedule.dc.html" style="flex: none; display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; background: #ECE5D6; font-size: 15px">맛집</a>
<a href="Expenses.dc.html" style="flex: none; display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; background: #ECE5D6; font-size: 15px">지출</a>
</nav>

<div style="margin-top: 18px; display: flex; align-items: center; gap: 18px; padding: 20px; border-radius: 24px; background: #D8EBE6; color: #0B3F39">
<svg width="84" height="84" viewBox="0 0 84 84" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{stats.percent}}" aria-label="준비물 완료율" style="flex: none">
<circle cx="42" cy="42" r="34" fill="none" stroke="#FFFFFF" stroke-width="9"/>
<circle cx="42" cy="42" r="34" fill="none" stroke="#0E5A52" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{stats.dash}}" transform="rotate(-90 42 42)"/>
<text x="42" y="48" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="18" font-weight="600" fill="#0B3F39">{{stats.percent}}%</text>
</svg>
<div>
<div style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums">{{stats.done}} / {{stats.total}}</div>
<div style="margin-top: 4px; font-size: 14px">{{stats.message}}</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; min-height: 48px">
<button type="button" role="switch" aria-checked="{{hide}}" onClick="{{toggleHide}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: transparent; font: 500 14px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
<span style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #857B66; display: block">
<sc-if value="{{hide}}" hint-placeholder-val="{{false}}"><span style="position: absolute; inset: 0; border-radius: 13px; background: #0E5A52"></span><span style="position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF"></span></sc-if>
<sc-if value="{{showAll}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF"></span></sc-if>
</span>챙긴 항목 숨기기</button>
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #857B66; background: transparent; font: 600 13px 'IBM Plex Sans KR', sans-serif; color: #0E5A52">대만 기본 목록 추가</button>
</div>

<sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
<section style="margin-top: 14px" aria-label="{{group.name}} 준비물">
<h2 style="margin: 0 0 4px; display: flex; align-items: baseline; justify-content: space-between; font-size: 14px; font-weight: 600; color: #5E594F"><span>{{group.name}}</span><span style="font-variant-numeric: tabular-nums">{{group.count}}</span></h2>
<div style="border-radius: 18px; border: 1px solid #E3DBCB; background: #FFFDF8; overflow: hidden">
<sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
<button type="button" role="checkbox" aria-checked="{{item.checked}}" onClick="{{item.toggle}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; box-sizing: border-box; padding: 6px 16px; border: 0; border-top: 1px solid #EFE8D9; background: transparent; text-align: left; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
<sc-if value="{{item.checked}}" hint-placeholder-val="{{false}}">
<span style="flex: none; width: 24px; height: 24px; border-radius: 8px; background: #0E5A52; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7"/></svg></span>
<span style="flex: 1; color: #7A7468; text-decoration: line-through">{{item.title}}</span>
</sc-if>
<sc-if value="{{item.unchecked}}" hint-placeholder-val="{{true}}">
<span style="flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid #857B66; box-sizing: border-box"></span>
<span style="flex: 1">{{item.title}}</span>
</sc-if>
</button>
</sc-for>
</div>
</section>
</sc-for>

<sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
<p style="margin: 18px 0 0; text-align: center; font-size: 15px; color: #0E5A52; font-weight: 600">모두 챙겼어요. 즐거운 여행 되세요!</p>
</sc-if>

<form onSubmit="{{noop}}" style="margin-top: 18px; display: flex; gap: 8px">
<label style="flex: 1; display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">준비물 이름</span>
<input type="text" placeholder="준비물 추가 (예: 보조배터리)" style="display: block; box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18"></label>
<button type="submit" style="flex: none; height: 52px; padding: 0 20px; border: 0; border-radius: 14px; background: #0E5A52; color: #FFFFFF; font: 600 15px 'IBM Plex Sans KR', sans-serif">추가</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1800}}'>
const GROUPS = [
  ['서류·결제', ['여권 (유효기간 확인)', '항공권·숙소 예약 확인서', '현금 (TWD 환전)', '해외 결제 카드', '교통카드 (EasyCard 등)', '여행자 보험']],
  ['의류', ['얇은 겉옷 (북부 아침저녁 쌀쌀)', '편한 신발', '우산·우비 (비가 잦음)', '속옷·양말']],
  ['세면·위생', ['칫솔·치약', '선크림', '휴대용 휴지·물티슈']],
  ['전자기기', ['eSIM 설치·활성화 확인', '충전기·케이블', '보조배터리 (기내 휴대)', '멀티 어댑터 (대만 110V·A형)']],
  ['약·건강', ['상비약 (소화제·진통제·밴드)', '개인 처방약']],
  ['기타', ['에코백·접이식 가방']]
];
const START = ['여권 (유효기간 확인)', '항공권·숙소 예약 확인서', '현금 (TWD 환전)', '해외 결제 카드', '교통카드 (EasyCard 등)', 'eSIM 설치·활성화 확인'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const done = {};
    START.forEach((t) => { done[t] = true; });
    this.state = { done, hide: false };
  }
  renderVals() {
    const done = this.state.done, hide = this.state.hide;
    let total = 0, count = 0;
    const groups = [];
    GROUPS.forEach(([name, titles]) => {
      const checkedHere = titles.filter((t) => done[t]).length;
      total += titles.length; count += checkedHere;
      const shown = titles.filter((t) => !(hide && done[t]));
      if (!shown.length) return;
      groups.push({
        name,
        count: checkedHere + '/' + titles.length,
        items: shown.map((title) => ({
          title,
          checked: !!done[title],
          unchecked: !done[title],
          toggle: () => this.setState((s) => ({ done: { ...s.done, [title]: !s.done[title] } }))
        }))
      });
    });
    const percent = total ? Math.round((count / total) * 100) : 0;
    const circ = 2 * Math.PI * 34;
    return {
      groups,
      hide,
      showAll: !hide,
      allDone: total > 0 && count === total,
      toggleHide: () => this.setState((s) => ({ hide: !s.hide })),
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      stats: {
        done: count, total, percent,
        dash: (circ * percent / 100).toFixed(1) + ' ' + circ.toFixed(1),
        message: count === total ? '준비 끝!' : '출발까지 ' + (total - count) + '개 남았어요'
      }
    };
  }
}
</script>
</body>
</html>
