<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>참여자와 공유</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F6F2EA; color: #1C1B18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; line-height: 1.55; padding: 0 20px">

<div style="display: flex; align-items: center; padding-top: 12px">
<a href="Schedule.dc.html" aria-label="일정으로" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</a>
</div>
<h1 style="margin: 4px 0 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 28px; line-height: 1.3; letter-spacing: -0.02em">함께하는 사람</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #5E594F">대만 4박 5일 · 3명</p>

<div style="margin-top: 18px; border-radius: 20px; border: 1px solid #E3DBCB; background: #FFFDF8; overflow: hidden">
<sc-for list="{{members}}" as="m" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; box-sizing: border-box; border-top: 1px solid #EFE8D9">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="flex: none"><circle cx="20" cy="20" r="20" fill="{{m.color}}"/><text x="20" y="26" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">{{m.initial}}</text></svg>
<div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 500">{{m.name}}</div><div style="font-size: 13px; color: #5E594F">{{m.role}}</div></div>
<sc-if value="{{m.canChange}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #857B66; background: transparent; font: 500 13px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">권한 변경</button></sc-if>
</div>
</sc-for>
</div>

<h2 style="margin: 28px 0 0; font-size: 18px; font-weight: 600">초대 링크</h2>
<p style="margin: 2px 0 0; font-size: 13px; color: #5E594F">링크를 받은 사람이 선택한 권한으로 참여해요.</p>

<div role="radiogroup" aria-label="초대 권한" style="display: flex; gap: 4px; margin-top: 12px; padding: 4px; border-radius: 16px; background: #ECE5D6">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="flex: 1; min-height: 56px; border: 0; border-radius: 12px; background: {{r.bg}}; color: #1C1B18; text-align: center; font-family: 'IBM Plex Sans KR', sans-serif; line-height: 1.3"><span style="display: block; font-size: 15px; font-weight: 600">{{r.name}}</span><span style="display: block; font-size: 12px; color: #5E594F">{{r.hint}}</span></button>
</sc-for>
</div>

<div style="margin-top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8">
<span style="flex: 1; min-width: 0; font-size: 14px; color: #5E594F; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">trip.helthssu.co.kr/invite/••••••••</span>
<button type="button" onClick="{{copy}}" style="flex: none; height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #0E5A52; color: #FFFFFF; font: 600 14px 'IBM Plex Sans KR', sans-serif">{{copyLabel}}</button>
</div>
<p role="status" style="margin: 6px 0 0; min-height: 22px; font-size: 13px; color: #0E5A52">{{copyNote}}</p>

<h2 style="margin: 18px 0 0; font-size: 18px; font-weight: 600">읽기 전용 공유</h2>
<div style="margin-top: 10px; padding: 16px; border-radius: 20px; border: 1px solid #E3DBCB; background: #FFFDF8">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div><div style="font-size: 16px; font-weight: 500">누구나 일정 보기</div><div style="font-size: 13px; color: #5E594F">로그인 없이 링크로 열람</div></div>
<button type="button" role="switch" aria-checked="{{shareOn}}" aria-label="읽기 전용 공유" onClick="{{toggleShare}}" style="flex: none; width: 56px; height: 44px; padding: 0; border: 0; background: transparent">
<span style="position: relative; display: block; width: 48px; height: 28px; margin: 0 auto; border-radius: 14px; background: #857B66">
<sc-if value="{{shareOn}}" hint-placeholder-val="{{false}}"><span style="position: absolute; inset: 0; border-radius: 14px; background: #0E5A52"></span><span style="position: absolute; top: 3px; left: 23px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></sc-if>
<sc-if value="{{shareOff}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></sc-if>
</span>
</button>
</div>
<div style="margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #FCEBC8; color: #5E3A00; font-size: 13px">숨김으로 표시한 일정, 지출, 맛집 보관함은 공유 화면에 나오지 않아요.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'editor', copied: false, share: true };
  }
  renderVals() {
    const s = this.state;
    return {
      members: [
        { initial: '나', name: '나', role: '소유자', color: '#0E5A52', canChange: false },
        { initial: 'A', name: '동행 A', role: '편집자', color: '#7A4FC2', canChange: true },
        { initial: 'B', name: '동행 B', role: '조회자', color: '#2F63C8', canChange: true }
      ],
      roles: [['editor', '편집자', '일정 수정 가능'], ['viewer', '조회자', '보기만 가능']].map(([v, name, hint]) => ({
        name, hint, on: s.role === v,
        bg: s.role === v ? '#FFFDF8' : 'transparent',
        pick: () => this.setState({ role: v, copied: false })
      })),
      copy: () => this.setState({ copied: true }),
      copyLabel: s.copied ? '복사됨' : '링크 복사',
      copyNote: s.copied ? (s.role === 'editor' ? '편집자 초대 링크를 복사했어요.' : '조회자 초대 링크를 복사했어요.') : '',
      shareOn: s.share, shareOff: !s.share,
      toggleShare: () => this.setState((p) => ({ share: !p.share }))
    };
  }
}
</script>
</body>
</html>
