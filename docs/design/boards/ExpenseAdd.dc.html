<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지출 추가</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; background: #F6F2EA; color: #1C1B18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; line-height: 1.55; overflow: hidden">

<div style="padding: 12px 20px 0">
<div style="height: 44px"></div>
<div style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 28px; line-height: 1.3">대만 4박 5일</div>
<div style="margin-top: 14px; padding: 22px; border-radius: 24px; background: #1C1B18; color: #F6F2EA"><div style="font-size: 13px; opacity: 0.8">총 사용 금액</div><div style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 34px">₩1,617,120</div></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28,27,24,0.5)"></div>

<div role="dialog" aria-label="지출 추가" style="position: absolute; left: 0; right: 0; bottom: 0; top: 130px; border-radius: 28px 28px 0 0; background: #F6F2EA; padding: 10px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #CFC6B2"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
<h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 22px">지출 추가</h1>
<button type="button" aria-label="닫기" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1C1B18">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 6px">
<label style="display: block; font-size: 14px; font-weight: 500">지출명
<input type="text" placeholder="예: 딘타이펑 점심" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>

<div style="display: flex; gap: 10px">
<label style="flex: 1.6; display: block; font-size: 14px; font-weight: 500">금액
<input type="text" inputmode="decimal" placeholder="850" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 600 20px 'IBM Plex Sans KR', sans-serif; color: #1C1B18; font-variant-numeric: tabular-nums">
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">통화
<select style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18"><option>TWD</option><option>KRW</option></select>
</label>
</div>
<p style="margin: -6px 0 0; font-size: 12px; color: #5E594F">통화가 다르면 환율 없이 따로 합산돼요.</p>

<div>
<div id="cat-label" style="font-size: 14px; font-weight: 500">카테고리</div>
<div role="radiogroup" aria-labelledby="cat-label" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #857B66; background: {{c.bg}}; color: {{c.fg}}; font: 500 15px 'IBM Plex Sans KR', sans-serif">{{c.name}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 10px">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">사용 날짜
<input type="date" value="2026-11-19" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">메모 (선택)
<input type="text" placeholder="2명 식사, 카드" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
</div>
</div>

<div style="margin-top: auto; padding-top: 16px">
<button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 18px; background: #0E5A52; color: #FFFFFF; font: 600 17px 'IBM Plex Sans KR', sans-serif">지출 저장</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
const CATS = ['식비', '교통', '숙박', '쇼핑', '관광', '기타', '+ 직접 입력'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: '식비' };
  }
  renderVals() {
    const cat = this.state.cat;
    return {
      cats: CATS.map((name) => ({
        name, on: cat === name,
        bg: cat === name ? '#1C1B18' : '#FFFDF8',
        fg: cat === name ? '#F6F2EA' : '#1C1B18',
        pick: () => this.setState({ cat: name })
      }))
    };
  }
}
</script>
</body>
</html>
