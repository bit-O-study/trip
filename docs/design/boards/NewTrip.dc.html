<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새 여행 만들기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #F6F2EA; color: #1C1B18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; line-height: 1.55; padding: 0 20px; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; justify-content: space-between; padding-top: 12px">
<a href="Main.dc.html" aria-label="닫기" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B18" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
</div>

<h1 style="margin: 6px 0 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 30px; line-height: 1.3; letter-spacing: -0.02em">어디로 떠나나요?</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #5E594F">이름과 날짜만 정하면 바로 시작할 수 있어요.</p>

<div style="margin-top: 22px; position: relative; overflow: hidden; border-radius: 22px; background: #0E5A52; color: #F6F2EA">
<div style="padding: 18px 20px 16px">
<div style="font-size: 12px; opacity: 0.8">미리보기</div>
<div style="margin-top: 6px; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">대만 4박 5일</div>
<div style="margin-top: 2px; font-size: 14px; opacity: 0.9">11.19 목 – 11.23 월</div>
</div>
<div style="position: relative; height: 0; border-top: 2px dashed rgba(246,242,234,0.45); margin: 0 16px">
<span style="position: absolute; left: -26px; top: -11px; width: 20px; height: 20px; border-radius: 10px; background: #F6F2EA"></span>
<span style="position: absolute; right: -26px; top: -11px; width: 20px; height: 20px; border-radius: 10px; background: #F6F2EA"></span>
</div>
<div style="display: flex; gap: 8px; padding: 12px 20px 14px; font-size: 13px"><span style="padding: 2px 10px; border-radius: 999px; background: rgba(246,242,234,0.18)">4박 5일</span><span style="padding: 2px 10px; border-radius: 999px; background: rgba(246,242,234,0.18)">타이베이 시간</span><span style="padding: 2px 10px; border-radius: 999px; background: rgba(246,242,234,0.18)">TWD</span></div>
</div>

<form style="margin-top: 22px; display: flex; flex-direction: column; gap: 16px">
<label style="display: block; font-size: 14px; font-weight: 500">여행 이름
<input type="text" value="대만 4박 5일" maxlength="80" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<div style="display: flex; gap: 12px">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">출발일
<input type="date" value="2026-11-19" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">도착일
<input type="date" value="2026-11-23" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
</div>
<div style="display: flex; gap: 12px">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">시간대
<select style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18"><option>타이베이 (UTC+8)</option><option>서울 (UTC+9)</option></select>
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">기준 통화
<select style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18"><option>TWD</option><option>KRW</option></select>
</label>
</div>
<p style="margin: -4px 0 0; font-size: 13px; color: #5E594F">시간은 선택한 시간대 기준으로 보여주고, 저장은 표준시(UTC)로 해요.</p>
</form>

<div style="margin-top: auto; padding: 16px 0 28px">
<button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 18px; background: #0E5A52; color: #FFFFFF; font: 600 17px 'IBM Plex Sans KR', sans-serif">여행 만들기</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
