<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지출 데스크톱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: #F6F2EA; color: #1C1B18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; line-height: 1.55">

<header style="border-bottom: 1px solid #E3DBCB; background: #FFFDF8">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 12px; background: #1C1B18; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6F2EA" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18c6 0 3-7 8-7 3 0 4-2 6-5"/></svg>
</div>
<span style="font-weight: 600; font-size: 16px">Trip Planner</span>
</div>
<nav aria-label="주요 메뉴" style="display: flex; align-items: center; gap: 8px">
<a href="HomeDesktop.dc.html" aria-current="page" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 22px; background: #ECE5D6; font-size: 15px; font-weight: 600">여행</a>
<a href="Login.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; font-size: 15px; color: #5E594F">내 계정</a>
</nav>
</div>
</header>

<div style="max-width: 1280px; margin: 0 auto; padding: 28px 32px 56px">
<a href="HomeDesktop.dc.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 14px; color: #5E594F">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>내 여행</a>
<h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 38px; line-height: 1.25; letter-spacing: -0.02em">대만 4박 5일</h1>
<p style="margin: 6px 0 0; font-size: 15px; color: #5E594F">11.19 목 – 11.23 월 · 가오슝 → 타이베이</p>

<nav aria-label="여행 메뉴" style="display: flex; gap: 8px; margin-top: 18px">
<a href="ScheduleDesktop.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 22px; background: #ECE5D6; font-size: 15px">일정</a>
<a href="Packing.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 22px; background: #ECE5D6; font-size: 15px">준비물</a>
<a href="Restaurants.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 22px; background: #ECE5D6; font-size: 15px">맛집</a>
<a href="ExpensesDesktop.dc.html" aria-current="page" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 22px; background: #1C1B18; color: #F6F2EA; font-size: 15px; font-weight: 600">지출</a>
</nav>

<div style="display: flex; flex-wrap: wrap; gap: 32px; margin-top: 24px; align-items: flex-start">

<section aria-label="지출 내역" style="flex: 1 1 520px; min-width: 0; max-width: 720px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="4">
<h2 style="margin: 18px 0 8px; display: flex; align-items: baseline; justify-content: space-between; font-size: 14px; font-weight: 600; color: #5E594F"><span>{{d.label}}</span><span style="font-variant-numeric: tabular-nums">{{d.sum}}</span></h2>
<div style="border-radius: 20px; border: 1px solid #E3DBCB; background: #FFFDF8; overflow: hidden">
<sc-for list="{{d.rows}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 16px; min-height: 68px; box-sizing: border-box; padding: 10px 20px; border-top: 1px solid #EFE8D9">
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="flex: none"><circle cx="5" cy="5" r="5" fill="{{r.color}}"/></svg>
<div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 500">{{r.title}}</div><div style="font-size: 13px; color: #5E594F">{{r.meta}}</div></div>
<div style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.amount}}</div>
<button type="button" aria-label="{{r.title}} 수정" style="flex: none; width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; color: #5E594F; font: 500 13px 'IBM Plex Sans KR', sans-serif">수정</button>
</div>
</sc-for>
</div>
</sc-for>
</section>

<aside aria-label="지출 요약" style="flex: 1 1 340px; min-width: 0; max-width: 420px; display: flex; flex-direction: column; gap: 16px">
<div style="padding: 26px; border-radius: 28px; background: #1C1B18; color: #F6F2EA">
<div style="font-size: 14px; opacity: 0.8">총 사용 금액</div>
<div style="margin-top: 4px; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 42px; line-height: 1.2; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">₩1,617,120</div>
<div style="margin-top: 8px; font-size: 13px; opacity: 0.75">8건 · 원화(KRW) 합계</div>
</div>

<div style="padding: 22px; border-radius: 24px; border: 1px solid #E3DBCB; background: #FFFDF8">
<h2 style="margin: 0 0 14px; font-size: 16px; font-weight: 600">카테고리별</h2>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<div>
<div style="display: flex; align-items: baseline; justify-content: space-between; font-size: 14px"><span style="font-weight: 500">{{c.name}}</span><span style="font-variant-numeric: tabular-nums">{{c.amount}} <span style="color: #5E594F">· {{c.pct}}</span></span></div>
<svg width="100%" height="10" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true" style="display: block; margin-top: 6px; border-radius: 5px"><rect width="100" height="10" fill="#ECE5D6"/><rect width="{{c.w}}" height="10" fill="{{c.color}}"/></svg>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #FCEBC8; color: #5E3A00; font-size: 13px">환전 ₩500,000은 현지 지출과 이중으로 더해질 수 있어요. 환전을 빼고 보면 ₩1,117,120이에요.</div>

<button type="button" style="height: 56px; border: 0; border-radius: 18px; background: #0E5A52; color: #FFFFFF; font: 600 17px 'IBM Plex Sans KR', sans-serif">지출 추가</button>
</aside>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
const C = { '숙박': '#0E5A52', '교통': '#2F63C8', '관광': '#C2410C', '기타': '#8A7F68' };
class Component extends DCLogic {
  renderVals() {
    const row = (title, cat, meta, amount) => ({ title, color: C[cat], meta: cat + ' · ' + meta, amount });
    return {
      days: [
        { label: '11.22 일', sum: '₩207,895', rows: [row('타이베이 화산딘 1박', '숙박', '11.22 – 11.23', '₩207,895')] },
        { label: '11.21 토', sum: '₩323,102', rows: [row('가오슝 난 난 1박', '숙박', '11.21 – 11.22', '₩323,102')] },
        { label: '11.19 목', sum: '₩284,733', rows: [row('가오슝 안 호텔 2박', '숙박', '11.19 – 11.21', '₩284,733')] },
        { label: '11.18 수 · 사전 결제', sum: '₩801,390', rows: [
          row('타이베이 스지 투어', '관광', '예약 선결제', '₩69,500'),
          row('가오슝 타이난 투어', '관광', '예약 선결제', '₩62,600'),
          row('기차', '교통', '예약 선결제', '₩152,400'),
          row('eSIM', '기타', '예약 선결제', '₩16,890'),
          row('환전', '기타', '현금 · 이중 집계 주의', '₩500,000')
        ] }
      ],
      cats: [
        { name: '숙박', amount: '₩815,730', pct: '50%', w: '50.4', color: C['숙박'] },
        { name: '기타', amount: '₩516,890', pct: '32%', w: '32.0', color: C['기타'] },
        { name: '교통', amount: '₩152,400', pct: '9%', w: '9.4', color: C['교통'] },
        { name: '관광', amount: '₩132,100', pct: '8%', w: '8.2', color: C['관광'] }
      ]
    };
  }
}
</script>
</body>
</html>
