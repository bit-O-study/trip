<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일정 추가</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1180px; box-sizing: border-box; background: #F6F2EA; color: #1C1B18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; line-height: 1.55; overflow: hidden">

<div style="padding: 12px 20px 0">
<div style="height: 44px"></div>
<div style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 28px; line-height: 1.3">대만 4박 5일</div>
<div style="margin-top: 18px; display: flex; align-items: center; gap: 12px">
<span style="width: 6px; height: 40px; border-radius: 3px; background: #D2452D"></span>
<div><div style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 20px">Day 1 · 가오슝 도착</div><div style="font-size: 13px; color: #5E594F">일정 4개</div></div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28,27,24,0.5)"></div>

<div role="dialog" aria-label="일정 추가" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; border-radius: 28px 28px 0 0; background: #F6F2EA; padding: 10px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #CFC6B2"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
<h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 22px">일정 추가</h1>
<button type="button" aria-label="닫기" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1C1B18">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>

<div role="tablist" aria-label="추가 방식" style="display: flex; gap: 4px; margin-top: 4px; padding: 4px; border-radius: 16px; background: #ECE5D6">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 12px; background: {{m.bg}}; color: #1C1B18; font: {{m.weight}} 15px 'IBM Plex Sans KR', sans-serif">{{m.name}}</button>
</sc-for>
</div>

<div style="flex: 1; overflow: hidden; margin-top: 16px">

<sc-if value="{{isPlace}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<label style="display: block; font-size: 14px; font-weight: 500">장소 검색
<span style="display: flex; align-items: center; gap: 8px; margin-top: 6px; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E594F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input type="search" value="가오슝 야시장" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</span>
</label>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #5E594F"><span>검색 제공 · Google (해외 지역)</span><span>결과 3건</span></div>
<div style="border-radius: 18px; border: 1px solid #E3DBCB; background: #FFFDF8; overflow: hidden">
<sc-for list="{{places}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; border-top: 1px solid #EFE8D9; box-sizing: border-box">
<div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 500">{{p.name}}</div><div style="font-size: 13px; color: #5E594F">{{p.meta}}</div></div>
<button type="button" style="flex: none; height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #0E5A52; color: #FFFFFF; font: 600 14px 'IBM Plex Sans KR', sans-serif">선택</button>
</div>
</sc-for>
</div>
<button type="button" style="height: 44px; border: 0; background: transparent; color: #0E5A52; font: 600 14px 'IBM Plex Sans KR', sans-serif">결과 더 보기</button>
<div style="display: flex; gap: 12px">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">날짜
<select style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18"><option>Day 1 · 11.19</option><option>Day 2 · 11.20</option></select>
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">시작 시각
<input type="time" value="18:30" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
</div>
</div>
</sc-if>

<sc-if value="{{isFlight}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 10px; align-items: flex-end">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">편명
<input type="text" placeholder="[항공사 코드 + 숫자]" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<button type="button" style="flex: none; height: 52px; padding: 0 20px; border: 0; border-radius: 14px; background: #1C1B18; color: #F6F2EA; font: 600 15px 'IBM Plex Sans KR', sans-serif">조회</button>
</div>
<div style="padding: 12px 14px; border-radius: 14px; background: #FCEBC8; color: #5E3A00; font-size: 13px">자동 조회가 안 되어도 괜찮아요. 아래에 직접 입력하면 같은 일정으로 저장돼요.</div>
<div style="display: flex; gap: 12px">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">출발 공항
<input type="text" value="ICN" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">도착 공항
<input type="text" value="KHH" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
</div>
<div style="display: flex; gap: 12px">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">출발 (서울 시각)
<input type="time" value="08:35" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">도착 (현지 시각)
<input type="time" value="10:25" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
</div>
</div>
</sc-if>

<sc-if value="{{isCustom}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: block; font-size: 14px; font-weight: 500">제목
<input type="text" placeholder="예: 마사지, 환전" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<div style="display: flex; gap: 12px">
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">시작
<input type="time" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
<label style="flex: 1; display: block; font-size: 14px; font-weight: 500">종료 (선택)
<input type="time" style="display: block; box-sizing: border-box; width: 100%; height: 52px; margin-top: 6px; padding: 0 12px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18">
</label>
</div>
<label style="display: block; font-size: 14px; font-weight: 500">메모
<textarea rows="4" placeholder="예약번호, 준비물, 가는 길 안내…" style="display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 12px 16px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; font: 400 16px 'IBM Plex Sans KR', sans-serif; color: #1C1B18; resize: none"></textarea>
</label>
</div>
</sc-if>
</div>

<button type="button" style="margin-top: 12px; flex: none; height: 56px; border: 0; border-radius: 18px; background: #0E5A52; color: #FFFFFF; font: 600 17px 'IBM Plex Sans KR', sans-serif">일정에 추가</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
const MODES = [['place', '장소'], ['flight', '항공'], ['custom', '직접 입력']];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'place' };
  }
  renderVals() {
    const mode = this.state.mode;
    return {
      isPlace: mode === 'place', isFlight: mode === 'flight', isCustom: mode === 'custom',
      modes: MODES.map(([v, name]) => ({
        name, on: mode === v,
        bg: mode === v ? '#FFFDF8' : 'transparent',
        weight: mode === v ? '600' : '400',
        pick: () => this.setState({ mode: v })
      })),
      places: [
        { name: '리우허 야시장', meta: '가오슝 · 야시장' },
        { name: '루이펑 야시장', meta: '가오슝 · 야시장' },
        { name: '보얼예술특구', meta: '가오슝 · 관광' }
      ]
    };
  }
}
</script>
</body>
</html>
