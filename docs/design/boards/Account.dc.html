<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계정과 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #F6F2EA; color: #1C1B18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; line-height: 1.55; padding: 0 20px">

<div style="display: flex; align-items: center; padding-top: 12px">
<a href="Main.dc.html" aria-label="여행 목록으로" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</a>
</div>
<h1 style="margin: 4px 0 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 28px; line-height: 1.3; letter-spacing: -0.02em">내 계정</h1>

<div style="margin-top: 18px; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; border: 1px solid #E3DBCB; background: #FFFDF8">
<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="flex: none"><circle cx="26" cy="26" r="26" fill="#0E5A52"/><text x="26" y="33" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">나</text></svg>
<div style="min-width: 0"><div style="font-size: 17px; font-weight: 600">로그인 계정</div><div style="font-size: 13px; color: #5E594F">카카오로 로그인했어요</div></div>
</div>

<h2 style="margin: 26px 0 8px; font-size: 14px; font-weight: 600; color: #5E594F">화면</h2>
<div style="padding: 16px; border-radius: 20px; border: 1px solid #E3DBCB; background: #FFFDF8; display: flex; flex-direction: column; gap: 16px">
<div>
<div id="theme-label" style="font-size: 15px; font-weight: 500">테마</div>
<div role="radiogroup" aria-labelledby="theme-label" style="display: flex; gap: 4px; margin-top: 8px; padding: 4px; border-radius: 14px; background: #ECE5D6">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: {{t.bg}}; color: #1C1B18; font: {{t.weight}} 15px 'IBM Plex Sans KR', sans-serif">{{t.name}}</button>
</sc-for>
</div>
</div>
<div>
<div id="size-label" style="font-size: 15px; font-weight: 500">글자 크기</div>
<div role="radiogroup" aria-labelledby="size-label" style="display: flex; gap: 4px; margin-top: 8px; padding: 4px; border-radius: 14px; background: #ECE5D6">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{z.on}}" onClick="{{z.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: {{z.bg}}; color: #1C1B18; font: {{z.weight}} {{z.px}}px 'IBM Plex Sans KR', sans-serif">{{z.name}}</button>
</sc-for>
</div>
<p style="margin: 8px 0 0; font-size: {{sample}}px; color: #5E594F">리우허 야시장 · 18:30 – 20:30</p>
</div>
</div>

<h2 style="margin: 22px 0 8px; font-size: 14px; font-weight: 600; color: #5E594F">알림</h2>
<div style="padding: 16px; border-radius: 20px; border: 1px solid #E3DBCB; background: #FFFDF8">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div><div style="font-size: 15px; font-weight: 500">항공 지연 알림</div><div style="font-size: 13px; color: #5E594F">편명을 등록한 항공편만</div></div>
<span style="flex: none; padding: 4px 10px; border-radius: 999px; background: #ECE5D6; color: #5E594F; font-size: 12px; font-weight: 600">준비 중</span>
</div>
</div>

<h2 style="margin: 22px 0 8px; font-size: 14px; font-weight: 600; color: #5E594F">정보</h2>
<div style="border-radius: 20px; border: 1px solid #E3DBCB; background: #FFFDF8; overflow: hidden">
<a href="Login.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; font-size: 15px">개인정보처리방침<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E594F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a href="Login.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-top: 1px solid #EFE8D9; font-size: 15px">위치정보 이용 고지<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E594F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</div>

<button type="button" style="margin-top: 22px; width: 100%; height: 52px; border-radius: 14px; border: 1px solid #857B66; background: #FFFDF8; color: #1C1B18; font: 600 16px 'IBM Plex Sans KR', sans-serif">로그아웃</button>
<button type="button" style="margin-top: 6px; width: 100%; height: 48px; border: 0; background: transparent; color: #B3261E; font: 500 14px 'IBM Plex Sans KR', sans-serif">계정 삭제</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'system', size: 'normal' };
  }
  renderVals() {
    const s = this.state;
    return {
      themes: [['light', '라이트'], ['dark', '다크'], ['system', '시스템']].map(([v, name]) => ({
        name, on: s.theme === v,
        bg: s.theme === v ? '#FFFDF8' : 'transparent',
        weight: s.theme === v ? '600' : '400',
        pick: () => this.setState({ theme: v })
      })),
      sizes: [['normal', '보통', 15], ['large', '크게', 18]].map(([v, name, px]) => ({
        name, px, on: s.size === v,
        bg: s.size === v ? '#FFFDF8' : 'transparent',
        weight: s.size === v ? '600' : '400',
        pick: () => this.setState({ size: v })
      })),
      sample: s.size === 'large' ? 19 : 14
    };
  }
}
</script>
</body>
</html>
